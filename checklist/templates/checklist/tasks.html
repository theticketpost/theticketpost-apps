<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<style>
    :root {
        --bg: #F4F4F5; --card: #FFFFFF; --text: #18181B; --muted: #71717A;
        --line: #E4E4E7; --accent: #18181B; --danger: #B91C1C;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #18181B; --card: #232326; --text: #F4F4F5; --muted: #A1A1AA;
            --line: #3F3F46; --accent: #F4F4F5; --danger: #F87171;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type=text] {
        flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
        background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    }
    button.add {
        padding: 10px 16px; font: inherit; font-weight: 600; border: 0; border-radius: 8px;
        background: var(--accent); color: var(--bg); cursor: pointer;
    }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 24px 0 8px; }
    ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    li label { flex: 1; display: flex; align-items: center; gap: 12px; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
    li input[type=checkbox] { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }
    li.done label span { text-decoration: line-through; color: var(--muted); }
    .del { flex: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; padding: 4px 6px; }
    .del:hover { color: var(--danger); }
    .empty { color: var(--muted); font-size: 14px; padding: 12px; }
    .switch { display: flex; gap: 8px; align-items: center; margin: 0 0 16px; font-size: 14px; color: var(--muted); }
    .switch select, .switch input { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    .error { color: var(--danger); font-size: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<main>
    <h1 id="title"></h1>
    <label class="switch">List
        <select id="lists" aria-label="List"></select>
    </label>
    <p class="sub">A section prints the list named in its “List” option. Done tasks print crossed out on the next ticket, then go away. The section isn't printed when nothing is pending.</p>

    <form id="add">
        <input type="text" id="text" maxlength="200" placeholder="New task" aria-label="New task" autocomplete="off" required>
        <button class="add" type="submit">Add</button>
    </form>
    <p class="error" id="error" role="alert"></p>

    <h2>Pending</h2>
    <ul id="pending"></ul>

    <h2 id="done-title">Done</h2>
    <ul id="done"></ul>
</main>

<script>
const API = {{ api|tojson }};
const NEW_LIST = '\u0000new';
let list = {{ list_name|tojson }};
const error = document.getElementById('error');

async function call(action, body) {
    error.textContent = '';
    try {
        const response = await fetch(API + '/' + action + (body === undefined ? '?list=' + encodeURIComponent(list) : ''), body === undefined ? {} : {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...body, list }),
        });
        if (!response.ok) throw new Error(response.status);
        const data = await response.json();
        list = data.list;
        render(data.tasks);
        renderLists(data.lists);
        return true;
    } catch (e) {
        error.textContent = 'Could not reach the service. Try again.';
        return false;
    }
}

function item(task) {
    const li = document.createElement('li');
    if (task.done) li.className = 'done';
    const label = document.createElement('label');
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = !!task.done;
    check.addEventListener('change', () => call('toggle', { id: task.id, done: check.checked }));
    const text = document.createElement('span');
    text.textContent = task.text;
    label.append(check, text);
    const del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.textContent = '×';
    del.title = 'Delete';
    del.setAttribute('aria-label', 'Delete ' + task.text);
    del.addEventListener('click', () => call('delete', { id: task.id }));
    li.append(label, del);
    return li;
}

function fill(list, tasks, emptyText) {
    list.replaceChildren(...tasks.map(item));
    if (!tasks.length && emptyText) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = emptyText;
        list.append(li);
    }
}

function render(tasks) {
    const done = tasks.filter(task => task.done);
    fill(document.getElementById('pending'), tasks.filter(task => !task.done), 'Nothing pending.');
    fill(document.getElementById('done'), done);
    document.getElementById('done').hidden = !done.length;
    document.getElementById('done-title').hidden = !done.length;
}

function renderLists(names) {
    document.getElementById('title').textContent = list;
    document.title = list + ' · Checklist';
    const select = document.getElementById('lists');
    const options = names.map(name => new Option(name, name, false, name === list));
    options.push(new Option('New list…', NEW_LIST));
    select.replaceChildren(...options);
}

function openList(name) {
    list = name;
    history.replaceState(null, '', '?list=' + encodeURIComponent(name));
    call('list');
}

document.getElementById('lists').addEventListener('change', (event) => {
    let name = event.target.value;
    if (name === NEW_LIST) {
        // not prompt(): an inline field is friendlier on phones
        name = '';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'List name, then Enter';
        input.setAttribute('aria-label', 'New list name');
        event.target.replaceWith(input);
        input.focus();
        const done = () => {
            input.replaceWith(event.target);
            if (input.value.trim()) openList(input.value.trim()); else event.target.value = list;
        };
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
        input.addEventListener('blur', done, { once: true });
        return;
    }
    openList(name);
});

document.getElementById('add').addEventListener('submit', async (event) => {
    event.preventDefault();
    const input = document.getElementById('text');
    const text = input.value.trim();
    if (!text) return;
    if (await call('add', { text })) input.value = '';
    input.focus();
});

call('list');
</script>
</body>
</html>
